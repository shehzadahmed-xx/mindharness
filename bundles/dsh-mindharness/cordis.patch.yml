# dsh-mindharness — 6 human-like plugins for Cordis
# Inserts 6 new rows over empty root (like dsh-base does)
- insert:
    - id: mindharness.provenance
      name: 'mindharness/provenance'
      service: ctx.provenance
      package: mindharness/provenance
      events: [session/event, agent/request]
      description: "L1 Witness — Span binding + attribution_audit"

    - id: mindharness.self-model
      name: 'mindharness/narrative-self'
      service: ctx.selfModel
      package: mindharness/narrative-self
      events: [session/event]
      dependsOn: [mindharness.provenance]

    - id: mindharness.body
      name: 'mindharness/body'
      service: ctx.embodied
      package: mindharness/body
      events: [agent/pre-step]

    - id: mindharness.metacog
      name: 'mindharness/metacognition'
      service: ctx.monitor
      package: mindharness/metacognition
      events: [agent/pre-step, agent/request]
      dependsOn: [mindharness.body]

    - id: mindharness.consolidation
      name: 'mindharness/consolidation'
      service: ctx.consolidator
      package: mindharness/consolidation
      events: [session/event, agent/turn-stopping]
      dependsOn: [mindharness.provenance, mindharness.self-model]

    - id: mindharness.dissolution
      name: 'mindharness/dissolution'
      service: ctx.dissolution
      package: mindharness/dissolution
      events: [session/event, agent/*]
      dependsOn: [mindharness.body, mindharness.self-model]
      config:
        irreversible: true
